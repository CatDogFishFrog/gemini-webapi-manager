[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-vault"
version = "0.2.0"
description = "Core for Gemini tooling: encrypted multi-account vault, slots, window/terminal-only Google login, usage-aware account selection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gemini-webapi>=2.1.1,<3",
    "cryptography>=42",
    "filelock>=3.13",
]

[project.optional-dependencies]
# Потрібен лише там, де відбувається вхід (вікно або консоль). Серверу з готовим vault.bin — не потрібен.
login = ["patchright>=1.50"]
dev = ["pytest>=8", "patchright>=1.50"]

[project.scripts]
gemini-vault = "gemini_vault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gemini_vault = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs a real Chromium (set GEMINI_VAULT_BROWSER_PATH or run `patchright install chromium`)"]
