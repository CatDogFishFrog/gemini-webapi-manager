[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-webapi-manager"
version = "0.2.0"
description = "Python API and CLI on top of gemini-vault: encrypted multi-account vault, active-account switching and usage info for gemini-webapi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["gemini-vault>=0.2.0,<0.3"]

[project.optional-dependencies]
login = ["gemini-vault[login]"]
dev = ["pytest>=8", "gemini-vault[dev]"]

[project.scripts]
gemini-webapi-manager = "gemini_webapi_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gemini_webapi_manager = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
