# Усе, що потрібно для запуску, лежить у цій теці (deploy/):  cp .env.example .env  &&  docker compose up -d --build
# Дані (vault.bin) зберігаються в іменованому томі gemini-data, а не в теках хоста. Докладно — README.md.
name: gemini-gateway

services:
  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile, target: gateway }
    image: gemini-gateway:local
    pull_policy: build
    restart: unless-stopped
    init: true                 # PID 1 передає сигнали й прибирає завершені процеси
    stop_grace_period: 40s     # час на коректну зупинку (запис cookie)
    env_file: .env             # GEMINI_MANAGER_KEY, GEMINI_GATEWAY_API_KEYS
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    working_dir: /data
    volumes:
      - gemini-data:/data

  # Адміністрування сховища (вхід в акаунти, список, зміна ключа). Окремий образ із браузером збирається лише на вимогу:
  #   docker compose run --rm vault-admin login-console 1 --email you@gmail.com
  vault-admin:
    profiles: ["admin"]
    build: { context: .., dockerfile: deploy/Dockerfile, target: admin }
    image: gemini-vault-admin:local
    pull_policy: build
    env_file: .env
    stdin_open: true
    tty: true
    shm_size: 1gb              # без цього Chromium у контейнері падає
    working_dir: /data
    volumes:
      - gemini-data:/data

volumes:
  gemini-data:
