[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-webapi-manager"
version = "0.1.0"
description = "Companion for gemini-webapi: guided Playwright login, encrypted multi-account vault, active-account switching and usage info."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gemini-webapi>=2.1.1,<3",
    "playwright>=1.45",
    "cryptography>=42",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gemini-webapi-manager = "gemini_webapi_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gemini_webapi_manager = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
